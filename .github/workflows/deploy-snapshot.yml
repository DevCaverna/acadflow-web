name: Deploy Snapshot

on:
  workflow_dispatch:
    inputs:
      environment:
        description: Target environment
        required: true
        type: choice
        options: [development, staging]
      commit:
        description: 'Full SHA on main (defaults to this run commit)'
        required: false
        type: string

permissions: {}

concurrency:
  group: acadflow-web-deploy-${{ inputs.environment }}
  cancel-in-progress: false

jobs:
  resolve:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      actions: read
      contents: read
      packages: read
    outputs:
      revision: ${{ steps.resolve.outputs.revision }}
      digest: ${{ steps.resolve.outputs.digest }}
    env:
      GH_TOKEN: ${{ github.token }}
      TARGET: ${{ inputs.environment }}
      SOURCE_COMMIT: ${{ inputs.commit }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4.1.3
      - name: Resolve source and look for a signed image
        id: resolve
        shell: bash
        run: |
          set -euo pipefail
          printf '%s' "$GH_TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
          bash .github/scripts/delivery.sh snapshot "$TARGET" "$SOURCE_COMMIT"

  publish:
    needs: resolve
    if: needs.resolve.outputs.digest == ''
    concurrency:
      group: acadflow-snapshot-${{ needs.resolve.outputs.revision }}
      cancel-in-progress: false
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      actions: read
      contents: read
      packages: write
      id-token: write
    env:
      REVISION: ${{ needs.resolve.outputs.revision }}
      GH_TOKEN: ${{ github.token }}
    outputs:
      digest: ${{ steps.publish.outputs.digest }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4.1.3
      - name: Recheck registry and keep trusted build helper
        id: recheck
        shell: bash
        env:
          TARGET: ${{ inputs.environment }}
        run: |
          set -euo pipefail
          printf '%s' "$GH_TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
          bash .github/scripts/delivery.sh snapshot "$TARGET" "$REVISION"
          install -m 0600 .github/scripts/publish-image.sh "$RUNNER_TEMP/publish-image.sh"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: steps.recheck.outputs.digest == ''
        with:
          ref: ${{ env.REVISION }}
          persist-credentials: false
      - uses: aquasecurity/setup-trivy@81e514348e19b6112ce2a7e3ecbafe19c1e1f567 # v0.3.1
        if: steps.recheck.outputs.digest == ''
        with:
          version: v0.76.2
      - name: Build, verify and sign the candidate
        id: publish
        shell: bash
        env:
          VERIFIED_DIGEST: ${{ steps.recheck.outputs.digest }}
        run: |
          set -euo pipefail
          digest=$VERIFIED_DIGEST
          if [[ -z $digest ]]; then
            digest=$(bash "$RUNNER_TEMP/publish-image.sh" "snapshot-$REVISION")
          fi
          printf 'digest=%s\n' "$digest" >> "$GITHUB_OUTPUT"
          # shellcheck disable=SC2016
          printf '### Signed candidate\n\n`%s@%s`\n\nImage: `%s@%s`\n' \
            "$REVISION" "$digest" "ghcr.io/${GITHUB_REPOSITORY,,}" "$digest" >> "$GITHUB_STEP_SUMMARY"

  deploy:
    needs: [resolve, publish]
    if: >-
      !cancelled() && needs.resolve.result == 'success' &&
      (needs.publish.result == 'success' ||
      (needs.publish.result == 'skipped' && needs.resolve.outputs.digest != ''))
    permissions:
      contents: read
      deployments: write
      packages: read
    uses: ./.github/workflows/deploy-image.yml
    secrets: inherit
    with:
      environment: ${{ inputs.environment }}
      version: snapshot
      revision: ${{ needs.resolve.outputs.revision }}
      digest: ${{ needs.resolve.outputs.digest || needs.publish.outputs.digest }}
