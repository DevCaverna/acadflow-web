name: Deploy Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Published version (X.Y.Z)'
        required: true
        type: string

permissions: {}

concurrency:
  group: acadflow-web-deploy-production
  cancel-in-progress: false

jobs:
  resolve:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      packages: read
    outputs:
      revision: ${{ steps.resolve.outputs.revision }}
      digest: ${{ steps.resolve.outputs.digest }}
      version: ${{ steps.resolve.outputs.version }}
    env:
      GH_TOKEN: ${{ github.token }}
      VERSION: ${{ inputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4.1.3
      - name: Verify the release image and production protection
        id: resolve
        shell: bash
        run: |
          set -euo pipefail
          printf '%s' "$GH_TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
          bash .github/scripts/delivery.sh resolve production "$VERSION"

  deploy:
    needs: resolve
    permissions:
      contents: read
      deployments: write
      packages: read
    uses: ./.github/workflows/deploy-image.yml
    secrets: inherit
    with:
      environment: production
      version: ${{ needs.resolve.outputs.version }}
      revision: ${{ needs.resolve.outputs.revision }}
      digest: ${{ needs.resolve.outputs.digest }}
