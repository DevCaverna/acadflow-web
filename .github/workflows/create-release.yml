name: Create Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version (vX.Y.Z)'
        required: true
        type: string
      candidate:
        description: 'Override the latest successful staging candidate (COMMIT@sha256:DIGEST)'
        required: false
        type: string

permissions: {}

concurrency:
  group: acadflow-web-release
  cancel-in-progress: false

jobs:
  release:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      actions: read
      contents: write
      deployments: read
      packages: read
    env:
      GH_TOKEN: ${{ github.token }}
      VERSION: ${{ inputs.version }}
      CANDIDATE: ${{ inputs.candidate }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4.1.3
      - name: Create or resume the release
        shell: bash
        run: |
          set -euo pipefail
          printf '%s' "$GH_TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
          bash .github/scripts/delivery.sh release "$VERSION" "$CANDIDATE"
